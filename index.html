<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <title>Vite App</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1 class="title">IP Address Tracker</h1>
        <form id="ipForm" class="ipForm">
          <input type="text" class="formInput" required />
          <button type="submit" form="ipForm">
            <img src="./src/images/icon-arrow.svg" alt="" />
          </button>
        </form>
        <div class="infoContainer">
          <div class="info">
            <h4>IP ADDRESS</h4>
            <p class="ipAddress_text">192.174.101</p>
          </div>
          <div class="info">
            <h4>LOCATION</h4>
            <p class="location_text">Somewhere in the world</p>
          </div>
          <div class="info">
            <h4>TIMEZONE</h4>
            <p class="timezone_text">UTC -05:00</p>
          </div>
          <div class="info">
            <h4>ISP</h4>
            <p class="isp_text">FuckStarlink</p>
          </div>
        </div>
      </header>
      <div id="map"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
